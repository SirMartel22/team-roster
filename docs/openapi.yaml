openapi: 3.1.0
info:
  title: Rosterly API
  version: 1.0.0
  description: Public client contract for auth-service and roster-core-service.
servers:
  - url: http://localhost:4001
    description: Local auth service
  - url: http://localhost:4002
    description: Local roster service
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
      required: [message]
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        churchId: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [admin, member] }
      required: [id, churchId, email, name, role]
paths:
  /teams:
    post:
      summary: Create a workspace and its first administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamName, workspaceSlug, name, email, password]
              properties:
                teamName: { type: string }
                workspaceSlug: { type: string }
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '201': { description: Workspace created }
        '409': { description: Workspace slug conflict }
  /login:
    post:
      summary: Authenticate within a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceSlug, email, password]
              properties:
                workspaceSlug: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: JWT and canonical user returned }
        '401': { description: Invalid credentials }
  /register:
    post:
      summary: Register a member through a single-use invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitationToken, name, email, password]
              properties:
                invitationToken: { type: string }
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '201': { description: JWT and canonical user returned }
        '400': { description: Invalid, expired, reused, or email-mismatched invitation }
  /me:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user }
  /subunits:
    get:
      summary: List units in the authenticated user's organisation
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Unit list }
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Unit created by an admin }
  /members:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Tenant and role-scoped member list }
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Current user's member profile created }
  /duties:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Tenant duties }
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Duty created by an admin }
  /rosters:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { description: Admin tenant roster or member's own published assignments }
  /rosters/generate:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Draft roster generated by an admin }
  /rosters/publish:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Roster published and notifications processed or retried }
  /invitations:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Admin invitation list }
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Single-use invitation created and emailed }
  /subunit-switch-requests:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Role-scoped switch requests }
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Member switch request created }
